<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wao Out Loud!</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1b1b;--teal:#4a7283;--rust:#a85535;--brn:#4a3128;--pale:#d9d9d9;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1b1b}}
:root[data-theme=dark]{--bg:#1b1b1b}
html{height:100%}body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:Prompt,sans-serif;user-select:none;-webkit-user-select:none}
#app{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;background:var(--teal);overflow:hidden;color:#fff}
#app *{box-sizing:border-box}img{pointer-events:none}
.hd{background:var(--rust);height:56px;font-size:30px;font-weight:700;display:flex;align-items:center;padding:0 22px;position:relative;z-index:5}
.hd .bk{margin-left:auto;cursor:pointer;font-size:34px}
.btn{background:var(--rust);color:#fff;border:0;border-radius:6px;font:600 20px Prompt;padding:8px 20px;cursor:pointer}
.btn.d{background:var(--brn)}.btn.w{background:#ddd;color:#222;border-radius:0;width:150px}.btn[disabled]{opacity:.45;cursor:default}
.abs{position:absolute}.fig{position:absolute;left:230px;top:0;width:500px;height:484px;display:flex;justify-content:center}.fig img{height:100%;max-width:100%;object-fit:contain}
.lvl{position:absolute;display:flex;align-items:center;gap:0}.circ{width:66px;height:66px;border-radius:50%;background:#444;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;line-height:1;z-index:2}.circ b{font-size:32px;font-weight:400}
.nm{background:#ddd;color:#222;width:190px;height:46px;margin-left:-14px;padding:2px 8px 0 24px;font-size:20px;line-height:1.1;position:relative}.nm small{display:block;font-size:9px}.nm i{position:absolute;left:0;bottom:0;height:4px;background:#e07a3a}
.sk{display:flex;gap:8px}.sk div{width:44px;height:48px;background:var(--brn);font-size:11px;text-align:center;padding-top:6px;line-height:1.2;color:#ddd}
.st{font-size:12px;line-height:1.9}.st span{display:inline-block;width:80px}
.pl{position:absolute;right:0;top:20px;width:190px}.pt{height:52px;margin-bottom:10px;background:#a9b4bb;opacity:.9;display:flex;align-items:center;cursor:pointer;font-size:24px;color:#222;font-weight:600;overflow:hidden}.pt img{height:52px}.pt.on{background:#e6e6e6;margin-left:-60px;height:62px}.pt.on img{height:62px}
.lockov{position:absolute;left:310px;top:150px;width:200px;text-align:center}.lockov img{width:110px;background:#6a3a2e;border-radius:50%;padding:22px}.lockov div{background:#000a;border-radius:10px;padding:10px;font-size:15px;margin-top:6px}
.card{width:200px;height:290px;background:linear-gradient(#ddd 45%,#222);display:flex;flex-direction:column;justify-content:flex-end;text-align:center;overflow:hidden;position:relative}.card img{position:absolute;left:0;top:0;width:100%;height:160px;object-fit:contain}.card b{padding:8px;font-size:18px;position:relative;line-height:1.2}.card .f{background:var(--rust);padding:7px;font-size:14px;cursor:pointer}.card.l .f{background:var(--brn);cursor:default}
.row{position:absolute;left:0;right:0;top:110px;display:flex;justify-content:center;gap:24px}.arr{position:absolute;top:220px;font-size:60px;color:#e8825a;cursor:pointer}
.box{background:#f4f0e2;color:#a85535;border:6px solid #a85535;margin:10px 40px;padding:14px 20px;font-size:20px;font-weight:600;line-height:1.7}.tab{display:inline-block;width:240px;padding:6px;text-align:center;background:var(--brn);margin:0 14px;font-weight:700;cursor:pointer}.tab.on{background:var(--rust)}.tab.l{opacity:.45;cursor:default}
.bub{position:absolute;left:90px;top:445px;background:#000c;border-radius:8px;padding:6px 14px;font-size:14px}
.big{position:absolute;left:600px;top:90px;width:340px;height:72px;background:#e07f55;font-size:46px;font-weight:700;padding-left:22px;cursor:pointer}
.gbg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(5px) brightness(.45);transform:scale(1.1)}
.bar{position:absolute;left:0;right:0;bottom:0;height:90px;background:var(--rust);display:flex;align-items:center;gap:14px;padding:0 14px 0 0}.bar>img{height:90px}
.pb{height:14px;background:#2a2a2a;width:260px;border:1px solid #0006;margin:4px 0}.pb i{display:block;height:100%;transition:width .2s}
.opt{width:190px;height:58px;background:#e6e6e6;color:#222;font-size:22px;font-weight:600;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;cursor:grab;touch-action:none;border-radius:4px;padding:2px 6px}.opt.drag{z-index:20;opacity:.85;box-shadow:0 8px 20px #0008;cursor:grabbing}
#target{position:absolute;left:590px;top:44px;width:230px;height:56px;background:#e6e6e6;color:#222;font-size:34px;font-weight:700;text-align:center;line-height:56px;border:3px dashed var(--rust)}
.pop{position:absolute;font-size:32px;font-weight:700;color:#ffd24a;text-shadow:0 2px 4px #000;animation:fl .8s forwards;pointer-events:none}@keyframes fl{to{transform:translateY(-60px);opacity:0}}
.hit{animation:hit .25s}@keyframes hit{50%{transform:translateX(12px);filter:brightness(2)}}.red{position:absolute;inset:0;background:#f003;pointer-events:none;animation:rd .35s forwards}@keyframes rd{to{opacity:0}}
.ov{position:absolute;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:30}.pn{background:var(--pale);color:#222;width:280px;text-align:center;padding-bottom:16px}.pn h3{background:var(--rust);color:#fff;margin:0 0 14px;padding:12px;font-weight:600}.pn .btn{display:block;width:230px;margin:10px auto}
.blink{animation:bl 1.6s infinite}@keyframes bl{50%{opacity:.15}}
input[type=range]{accent-color:var(--rust);width:220px}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}

const hd=(t,b)=>`<div class=hd>${t}${b?`<span class=bk data-go="${b}">↩</span>`:''}</div>`;
const back=(g,a='')=>`<button class=btn style="position:absolute;left:18px;bottom:16px" data-go="${g}" data-a="${a}">↩ ย้อนกลับ</button>`;
const lvl=(k,l,s)=>{const c=C[k],lk=!c.ok();return `<div class=lvl style="${s}"><div class=circ>${lk?img('lock','width:34px'):`เลเวล<b>${lv(k)}</b>`}</div><div class=nm>${c.n}<small>ชั้น ๐ - ศิษย์ฝึกหัด</small><i style="width:${S.xp[k]%250/2.5}%"></i></div></div>`};
const vol=s=>`<div class=abs style="${s};display:flex;align-items:center;gap:12px">${img('snd','width:50px')}<input type=range min=0 max=100 value=${S.vol*100} data-vol></div>`;
const R={};function go(s,a){clearInterval(tick);G=null;R[s](a)}
app.addEventListener('click',e=>{const el=e.target.closest('[data-go]'),b=e.target.closest('[data-sel]');if(b){S.sel=b.dataset.sel;save();return go('chars',S.sel)}if(el&&!el.disabled){beep(520);go(el.dataset.go,el.dataset.a)}});
app.addEventListener('input',e=>{if(e.target.dataset.vol!=null){S.vol=e.target.value/100;save();beep(660)}});
R.title=()=>set(`<div data-go=home style="position:absolute;inset:0;cursor:pointer">${img('title','width:100%;height:100%;object-fit:cover')}<div style="position:absolute;inset:0;background:linear-gradient(#0000 50%,#000b)"></div><div style="position:absolute;left:0;right:0;top:340px;text-align:center;font-size:74px;font-weight:700;color:#ffb27a;-webkit-text-stroke:3px #a85535;paint-order:stroke">Wao Out Loud!</div><div class=blink style="position:absolute;left:0;right:0;top:450px;text-align:center;font-size:24px">Click to Start the game</div></div>`);
R.home=()=>{const k=S.sel,c=C[k],x=S.xp[k]%250;set(`<div class=fig style="left:60px;top:20px;height:520px">${img(k)}</div><div class=bub>${c.say}</div>${lvl(k,0,'left:14px;top:460px')}<div style="position:absolute;left:14px;top:518px;font-size:9px;background:#e07a3a;width:170px;text-align:center;margin-left:52px">${x}/250 XP</div><div class=big data-go=modes>เล่น</div><div class=abs style="left:600px;top:172px;display:flex;gap:10px"><button class="btn w" data-go=chars>ตัวละคร</button><button class="btn w" data-go=title>หน้าหลัก</button></div>${vol('left:600px;top:240px')}`)};
R.chars=v=>{v=v||S.sel;const c=C[v],lk=!c.ok();set(`${hd('ตัวละคร','home')}<div class=abs style="inset:56px 0 0 0"><div class=fig style="opacity:${lk?.35:1}">${img(v)}</div>${lvl(v,0,'left:8px;top:8px')}${lk?'':S.sel==v?'<div class=btn style="position:absolute;left:218px;top:10px;padding:14px 10px;font-size:14px">Selected</div>':`<button class="btn d" style="position:absolute;left:218px;top:10px" data-sel="${v}">Select</button>`}<div class=abs style="left:14px;top:90px;font-size:15px">คาถาเวทย์<div class=sk style="margin-top:6px">${c.sk.map(l=>`<div>เลเวล<br>${l}</div>`).join('')}</div><div class=st style="margin-top:12px"><span>พลังชีวิต</span>${c.hp}<br><span>พลังโจมตี</span>${c.atk}<br><span>ป้องกัน</span>${c.def}</div></div>${lk?`<div class=lockov>${img('lock')}<div>${c.need}</div></div>`:''}<div class=pl>${Object.keys(C).map(k=>`<div class="pt ${k==v?'on':''}" data-go=chars data-a=${k}>${img(C[k].p)}${k==v?`<span style="padding-left:12px">${C[k].n}</span>`:''}</div>`).join('')}</div></div>`)};
const card=(t,g,f,l,go,a='')=>`<div class="card ${l?'l':''}">${img(g)}<b>${t}</b><div class=f ${l?'':`data-go=${go} data-a="${a}"`}>${f}</div></div>`;
R.modes=()=>set(`${hd('โหมดการเล่น')}<div class=row style="top:90px;gap:40px">${card('โหมดคำศัพท์','g3','▶',0,'cats')}${card('โหมด Arcade','g1',cd(0)?'▶':'ผ่านหมวดคำศัพท์ 1-3',!cd(0),'arc')}</div>${back('home')}`);
R.cats=p=>{p=+p||0;const cs=[0,1,2].map(i=>p*3+i);set(`${hd('โหมดคำศัพท์')}<div class=row>${cs.map(i=>card(CATS[i][0],'g'+i%4,open(i,0)?'▶':`ผ่านหมวดคำศัพท์ ${i}-3`,!open(i,0),'intro',i+':0')).join('')}</div>${p>0?`<div class=arr style="left:6px" data-go=cats data-a=${p-1}>◀</div>`:''}${p<2?`<div class=arr style="right:6px" data-go=cats data-a=${p+1}>▶</div>`:''}${back('modes')}`)};
R.intro=a=>{const[c,s]=(a||'0:0').split(':').map(Number);set(`${hd(CATS[c][0])}<div style="text-align:center;margin-top:12px">${[0,1,2].map(i=>`<span class="tab ${i==s?'on':''} ${open(c,i)?'':'l'}" ${open(c,i)?`data-go=intro data-a="${c}:${i}"`:''}>ด่าน ${i+1}${clr(c,i)?' ✓':''}</span>`).join('')}</div><div class=box>${sw(c,s).map(w=>`${w[0]} &nbsp;= ${w[1]}`).join('<br>')}</div>${back('cats',c/3|0)}<button class=btn style="position:absolute;right:40px;bottom:16px;font-size:24px" data-go=play data-a="${c}:${s}">ลุยโลด</button>`)};
const rnd=n=>Math.random()*n|0;
function start(cfg){const c=C[S.sel];G=Object.assign({c,hp:c.hp,ap:0,cor:0,run:0,score:0,floor:1,t:0,left:60000,paused:0,over:0,lock:0,deck:[]},cfg);ghost();set(`<div class=gbg style="background-image:url(${A.title})"></div><div id=pop></div><div class=abs style="left:20px;top:14px;font-size:20px;font-weight:700" id=info></div><div class=pb id=gh style="position:absolute;left:575px;top:14px;width:260px;height:22px;border-color:#fff"><i style="background:#c01818;width:100%"></i></div><div id=target></div><div class=abs style="left:590px;top:100px;width:230px;height:5px;background:#0006"><i id=afk style="display:block;height:100%;background:#ffd24a"></i></div><div class=abs id=gs style="left:540px;top:110px;width:310px;height:340px;display:flex;justify-content:center;align-items:flex-end">${img('g'+G.gi,'max-height:340px;max-width:310px')}</div><div class=abs id=ops style="left:30px;top:300px;display:grid;grid-template-columns:190px 190px;gap:10px"></div><div class=bar>${img(S.sel=='k'?'kp':C[S.sel].p)}<div style="font-size:12px;width:280px;line-height:1.2">พลังชีวิต <span id=ht style="float:right"></span><div class=pb><i id=hp style="background:#4caf50"></i></div>แต้มเวทย์ <span id=at style="float:right"></span><div class=pb><i id=ap style="background:#e8a020"></i></div></div><div style="font-size:10px">คาถาเวทย์<div class=sk style="margin-top:3px">${C[S.sel].sk.map(l=>`<div style="height:34px;width:38px;padding-top:2px">🔒${l}</div>`).join('')}</div></div><img id=mn src="${A.menu}" style="margin-left:auto;height:60px;pointer-events:auto;cursor:pointer"></div>`);G.ghp=0;nextQ();ui();tick=setInterval(step,100)}
const cfgIdx=()=>G.ci*3+G.si;
function ghost(){const m=G.mode,i=m=='cat'?G.ci*3+G.si:G.floor*2;G.gi=rnd(4);G.gmax=m=='cat'?450+i*60:400+G.floor*80;G.gh=G.gmax;G.gatk=m=='cat'?70+i*4:60+G.floor*8}
function nextQ(){const g=G;if(!g.deck.length)g.deck=shuf(g.pool);const p=g.deck.pop(),rev=g.dir==1||(g.dir==2&&rnd(2)),k=rev?1:0,a=rev?0:1;const ds=[...new Set([...shuf(g.pool),...shuf(ALL)].map(w=>w[a]))].filter(x=>x!=p[a]).slice(0,3);g.q={q:p[k],a:p[a]};g.t=0;g.lock=0;$('#target').textContent=p[k];$('#ops').innerHTML=shuf([p[a],...ds]).map(o=>`<div class=opt data-v="${o}">${o}</div>`).join('')}
function ui(){const g=G;$('#hp').style.width=g.hp/g.c.hp*100+'%';$('#ht').textContent=g.mode=='time'?'':`${Math.max(0,g.hp)}/${g.c.hp}`;$('#ap').style.width=g.ap+'%';$('#at').textContent=g.ap+'/100';$('#gh i').style.width=g.gh/g.gmax*100+'%';$('#afk').style.width=(1-g.t/AFK)*100+'%';$('#gh').style.visibility=g.mode=='time'?'hidden':'';$('#info').textContent=g.mode=='cat'?`${CATS[g.ci][0]} ด่าน ${g.si+1}`:g.mode=='tower'?`ชั้น ${g.floor}`:`คะแนน ${g.score} · เวลา ${Math.ceil(g.left/1000)}s`;if(g.run>=2)$('#info').textContent+=` 🔥${g.run}`}
function pop(t,x,y,c){const d=document.createElement('div');d.className='pop';d.textContent=t;d.style.cssText+=`left:${x}px;top:${y}px;${c?'color:'+c:''}`;$('#pop').appendChild(d);setTimeout(()=>d.remove(),800)}
function miss(){const g=G;g.run=0;beep(130,.25,'sawtooth');if(g.mode!='time'){const d=Math.round(g.gatk*100/(100+g.c.def));g.hp-=d;pop('-'+d,120,360,'#ff6a6a');const r=document.createElement('div');r.className='red';app.appendChild(r);setTimeout(()=>r.remove(),400);if(g.hp<=0)return end(0)}nextQ();ui()}
function answer(v){const g=G;if(g.lock||g.over)return;g.lock=1;if(v!=g.q.a){const o=[...document.querySelectorAll('.opt')].find(x=>x.dataset.v==g.q.a);if(o)o.style.background='#8fd18f';setTimeout(()=>{if(G==g)miss()},450);return}
beep(760);g.cor++;g.run++;S.xp[S.sel]+=5;if(g.cor%3==0)g.ap=Math.min(100,g.ap+25);if(g.run%5==0){g.ap=Math.min(100,g.ap+50);pop('COMBO +50 AP',420,240)}
if(g.mode=='time'){g.score+=10+(g.run>=5?5:0)}else{g.gh-=g.c.atk;pop('-'+g.c.atk,640,150);const e=$('#gs');e.classList.remove('hit');void e.offsetWidth;e.classList.add('hit')}
if(g.mode!='time'&&g.gh<=0){if(g.mode=='cat')return end(1);g.floor++;g.hp=Math.min(g.c.hp,g.hp+g.c.hp*.15|0);ghost();$('#gs').innerHTML=img('g'+g.gi,'max-height:340px;max-width:310px');pop('ชั้น '+g.floor,420,200)}nextQ();ui()}
function step(){const g=G;if(!g||g.paused||g.over||g.lock)return;g.t+=100;if(g.mode=='time'){g.left-=100;if(g.left<=0)return end(1)}if(g.t>=AFK)miss();else ui()}
const AFK=7000;
function end(w){const g=G;g.over=1;clearInterval(tick);let t,b;if(g.mode=='cat'){if(w){S.c[g.ci+'-'+g.si]=1;S.xp[S.sel]+=30;t='ชนะแล้ว! +30 XP';b=`<button class=btn data-go=intro data-a="${g.ci}:${Math.min(2,g.si+1)}">ไปต่อ</button>`}else{t='พ่ายแพ้...';b=`<button class=btn data-go=play data-a="${g.ci}:${g.si}">ลองใหม่</button>`}}
else{const key=g.mode+'B',sc=g.mode=='tower'?g.floor:g.score;S[key]=Math.max(S[key]||0,sc);t=g.mode=='tower'?`ถึงชั้น ${g.floor}`:`คะแนน ${g.score}`;t+=`<br><small>สูงสุด ${S[key]}</small>`;b=`<button class=btn data-go=${g.again[0]} data-a="${g.again[1]}">เล่นอีกครั้ง</button>`}save();
const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class=pn><h3>${t}</h3>${b}<button class="btn d" data-go=home>กลับหน้าหลัก</button></div>`;app.appendChild(o)}
R.play=a=>{const[c,s]=a.split(':').map(Number);G={};start({mode:'cat',ci:c,si:s,pool:sw(c,s),dir:s})};
R.arc=()=>set(`${hd('โหมด Arcade')}<div class=row style="top:90px;gap:40px">${card('แข่งกับเวลา','g2','▶',0,'time')}${card('ไต่หอคอยผี','g0',cd(7)?'▶':'ผ่านหมวดคำศัพท์ 8-3',!cd(7),'tower')}</div>${back('modes')}`);
R.time=()=>{const n=Math.max(1,done()),op=(i)=>`<option>${i}</option>`,L=[...Array(n)].map((_,i)=>op(i+1)).join('');set(`${hd('แข่งกับเวลา','arc')}<div style="text-align:center;margin-top:90px;font-size:26px">เลือกช่วงหมวดคำศัพท์<br><br>หมวด <select id=lo style="font:24px Prompt">${L}</select> ถึง <select id=hi style="font:24px Prompt">${L}</select><br><br><small style="font-size:16px">ตอบถูกได้ 10 คะแนน · เวลา 60 วินาที · สูงสุด ${S.timeB||0}</small><br><br><button class=btn style="font-size:26px" id=go>เริ่ม</button></div>`);$('#hi').value=n;$('#go').onclick=()=>{let a=+$('#lo').value,b=+$('#hi').value;if(a>b)[a,b]=[b,a];R.tg(a+':'+b)}};
R.tg=a=>{const[a1,b]=a.split(':').map(Number);start({mode:'time',pool:CATS.slice(a1-1,b).flatMap(c=>c[1]),dir:2,again:['tg',a]})};
R.tower=()=>start({mode:'tower',pool:ALL,dir:2,again:['tower','']});
app.addEventListener('pointerdown',e=>{const o=e.target.closest('.opt'),m=e.target.closest('#mn');if(m&&G&&!G.over){G.paused=1;const v=document.createElement('div');v.className='ov';v.id='pz';v.innerHTML=`<div class=pn><h3>Paused</h3><button class="btn d" data-r>Resume</button><div style="display:flex;justify-content:center;padding:6px"><input type=range min=0 max=100 value=${S.vol*100} data-vol style="width:180px"></div><button class="btn d" data-go=home>Quit to menu</button></div>`;app.appendChild(v);return}
if(!o||!G||G.paused||G.lock)return;let mv=0,sx=e.clientX,sy=e.clientY;o.setPointerCapture(e.pointerId);o.classList.add('drag');
const f=ev=>{const dx=(ev.clientX-sx)/sc,dy=(ev.clientY-sy)/sc;if(Math.abs(dx)+Math.abs(dy)>8)mv=1;o.style.transform=`translate(${dx}px,${dy}px)`},u=ev=>{o.removeEventListener('pointermove',f);o.removeEventListener('pointerup',u);o.style.pointerEvents='none';const t=document.elementFromPoint(ev.clientX,ev.clientY);o.style.cssText='';o.classList.remove('drag');if(!mv||(t&&t.closest('#target')))answer(o.dataset.v)};o.addEventListener('pointermove',f);o.addEventListener('pointerup',u)});
app.addEventListener('click',e=>{if(e.target.closest('[data-r]')){G.paused=0;$('#pz').remove()}});
R.title();
</script></body></html>
